[workspace]
resolver = "3"
members = [
    "crates/elal_core",
    "crates/elal_protocol",
    "crates/elal_provider",
    "crates/elal_models",
    "crates/elal_tools",
    "crates/elal_tasks",
    "crates/elal_safety",
    "crates/elal_mcp",
    "crates/elal_client",
    "crates/elal_server",
    "crates/elal_tui",
    "crates/elal_cli",
    "crates/elal_utils",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
rust-version = "1.85"
authors = ["lobinuxsoft"]
repository = "https://github.com/lobinuxsoft/elal"

[workspace.dependencies]
# Internal crates
elal_core     = { path = "crates/elal_core" }
elal_protocol = { path = "crates/elal_protocol" }
elal_provider = { path = "crates/elal_provider", default-features = false }
elal_models   = { path = "crates/elal_models", default-features = false }
elal_tools    = { path = "crates/elal_tools" }
elal_tasks    = { path = "crates/elal_tasks" }
elal_safety   = { path = "crates/elal_safety" }
elal_mcp      = { path = "crates/elal_mcp" }
elal_client   = { path = "crates/elal_client" }
elal_server   = { path = "crates/elal_server" }
elal_tui      = { path = "crates/elal_tui" }
elal_utils    = { path = "crates/elal_utils" }

# LLM inference (embedded) — Vulkan default, ROCm feature-gated (ADR-1, ADR-2)
llama-cpp-2 = { version = "0.1", default-features = false, features = ["sampler", "openmp"] }

# Async runtime
tokio         = { version = "1", features = ["full"] }
tokio-stream  = "0.1"
futures       = "0.3"
async-trait   = "0.1"
async-stream  = "0.3"

# HTTP (HF downloads + web tools ONLY, NEVER for LLM inference — ADR-2)
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

# Serialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "0.8"

# Error handling
thiserror = "2"
anyhow    = "1"

# Logging
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender   = "0.2"

# TUI
# ratatui 0.30 pulls crossterm through `ratatui-crossterm`. Both must resolve to
# the SAME crossterm or the `Color`/`Attribute` conversions between them stop
# existing: two copies of a crate are two unrelated types to the compiler.
ratatui       = { version = "0.30", features = ["crossterm_0_29"] }
crossterm     = { version = "0.29", features = ["event-stream"] }
unicode-width = "0.2"
textwrap      = "0.16"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# File operations
walkdir  = "2"
globwalk = "0.9"
similar  = "2"
glob     = "0.3"

# Syntax highlighting
syntect = "5"

# HTML/Web
scraper = "0.22"
htmd    = "0.2"

# Progress bars
indicatif = "0.17"

# Misc
dirs         = "6"
uuid         = { version = "1", features = ["serde", "v4", "v7"] }
chrono       = { version = "0.4", features = ["serde"] }
bytes        = "1"
regex        = "1"
smol_str     = { version = "0.3", features = ["serde"] }
tempfile     = "3"
schemars     = "0.8"
strum        = "0.27"
strum_macros = "0.28"
sha2         = "0.10"

# Search (ripgrep building blocks)
grep-searcher = "0.1"
grep-regex    = "0.1"
grep-matcher  = "0.1"

# HTTP mocking (dev only)
httpmock = "0.8"

[profile.release]
opt-level = 3
lto       = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 0
debug     = true

[package]
name = "oma_models"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[features]
# Feature pass-through to oma_provider so the consumer (oma_cli) can
# pick the compute backend at build time. Defaults match oma_cli.
default = ["vulkan"]
vulkan  = ["oma_provider/vulkan"]
rocm    = ["oma_provider/rocm"]
dual    = ["oma_provider/dual"]

[dependencies]
oma_provider = { workspace = true, default-features = false }

thiserror = { workspace = true }
tracing   = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
